<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc">
  <title id="title">Georg Rybski | Software Engineer</title>
  <desc id="desc">Full-stack / systems / automation. Build what builds. Own what follows. Define, bound, delegate, validate. A fine enclosure surrounds delegated execution; validation stays outside it. Rust / Nix / Linux / TypeScript.</desc>
  <style>
    .background { fill: #ffffff; }
    .frame { fill: #f6f8fa; stroke: #d0d7de; }
    .cell { fill: #ffffff; stroke: #d0d7de; }
    .rule { fill: none; stroke: #d0d7de; }
    .flow { fill: none; stroke: #8c959f; stroke-width: 1.6; }
    .boundary { fill: none; stroke: #0969da; stroke-width: 1.5; stroke-dasharray: 4 6; opacity: 0.5; }
    .primary { fill: #1f2328; }
    .secondary { fill: #57606a; }
    .accent { fill: #0969da; }
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
    .signature { font-size: 20px; font-weight: 700; letter-spacing: 2px; }
    .profession { font-size: 50px; font-weight: 700; letter-spacing: 1px; }
    .qualifier { font-size: 24px; }
    .statement { font-size: 58px; font-weight: 600; letter-spacing: -1.2px; }
    .answer { font-size: 62px; font-weight: 700; letter-spacing: -1.2px; }
    .step { font-size: 28px; font-weight: 700; letter-spacing: 1px; }
    .stack { font-size: 22px; }
    @media (prefers-color-scheme: dark) {
      .background { fill: #0d1117; }
      .frame { fill: #161b22; stroke: #30363d; }
      .cell { fill: #0d1117; stroke: #30363d; }
      .rule { stroke: #30363d; }
      .flow { stroke: #8b949e; }
      .boundary { stroke: #58a6ff; }
      .primary { fill: #f0f6fc; }
      .secondary { fill: #a3adb8; }
      .accent { fill: #58a6ff; }
    }
    /* Keep short labels readable when the image is embedded on a narrow page. */
    @media (max-width: 520px) {
      .signature { font-size: 32px; }
      .profession { font-size: 58px; }
      .qualifier { font-size: 32px; }
      .statement { font-size: 66px; }
      .answer { font-size: 70px; }
      .step { font-size: 34px; }
      .stack { font-size: 30px; }
    }
  </style>

  <rect width="1200" height="740" rx="24" class="background"/>
  <rect x="22" y="22" width="1156" height="696" rx="18" class="frame"/>

  <text x="84" y="84" class="signature accent">GEORG RYBSKI</text>
  <text x="84" y="150" class="profession primary">SOFTWARE ENGINEER</text>
  <text x="84" y="194" class="qualifier secondary">full-stack / systems / automation</text>
  <path d="M84 232 H1116" class="rule"/>

  <text x="84" y="330" class="statement primary">Build what builds.</text>
  <text x="84" y="406" class="answer primary">Own what follows.</text>

  <!-- The four cells share dimensions, padding, and baselines. -->
  <g transform="translate(84 494)">
    <rect width="210" height="80" rx="12" class="cell"/>
    <text x="105" y="50" text-anchor="middle" class="step primary">DEFINE</text>
  </g>
  <path d="M306 534 H345 M339 529 L345 534 L339 539" class="flow"/>
  <g transform="translate(358 494)">
    <rect width="210" height="80" rx="12" class="cell"/>
    <text x="105" y="50" text-anchor="middle" class="step primary">BOUND</text>
  </g>
  <path d="M580 534 H619 M613 529 L619 534 L613 539" class="flow"/>

  <!-- The execution boundary deliberately excludes validation. -->
  <rect x="616" y="478" width="242" height="112" rx="18" class="boundary"/>
  <g transform="translate(632 494)">
    <rect width="210" height="80" rx="12" class="cell"/>
    <text x="105" y="50" text-anchor="middle" class="step accent">DELEGATE</text>
  </g>
  <path d="M854 534 H893 M887 529 L893 534 L887 539" class="flow"/>
  <g transform="translate(906 494)">
    <rect width="210" height="80" rx="12" class="cell"/>
    <text x="105" y="50" text-anchor="middle" class="step primary">VALIDATE</text>
  </g>

  <path d="M84 630 H1116" class="rule"/>
  <text x="84" y="682" class="stack secondary">rust / nix / linux / typescript</text>
</svg>
