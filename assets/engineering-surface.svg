<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc">
  <title id="title">Georg Rybski | Software engineer</title>
  <desc id="desc">Systems that let software act. Full-stack / agentic systems / security. Build what builds. Own what follows. Define policy, scope authority, delegate work, validate results. Delegated work has its own boundary; validation stays outside it. TypeScript / Rust / Nix / Linux.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow"/>
    </marker>
  </defs>

  <style>
    .bg { fill: #ffffff; }
    .frame, .node { fill: #f6f8fa; stroke: #d0d7de; }
    .hairline { stroke: #d0d7de; }
    .flow { stroke: #8c959f; }
    .arrow { fill: #8c959f; }
    .boundary { fill: none; stroke: #0969da; stroke-width: 1.5; stroke-dasharray: 4 6; opacity: 0.4; }
    .primary { fill: #1f2328; }
    .secondary { fill: #57606a; }
    .accent { fill: #0969da; }
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
    .signature { font-size: 26px; font-weight: 700; letter-spacing: 1.2px; }
    .headline { font-size: 46px; font-weight: 700; letter-spacing: -1px; }
    .role { font-size: 24px; }
    .statement { font-size: 38px; font-weight: 600; letter-spacing: -0.45px; }
    .node-title { font-size: 30px; font-weight: 700; letter-spacing: 0.5px; }
    .node-sub { font-size: 23px; }
    .footer { font-size: 22px; }

    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .frame, .node { fill: #161b22; stroke: #30363d; }
      .hairline { stroke: #30363d; }
      .flow { stroke: #6e7681; }
      .arrow { fill: #6e7681; }
      .boundary { stroke: #58a6ff; }
      .primary { fill: #f0f6fc; }
      .secondary { fill: #8b949e; }
      .accent { fill: #58a6ff; }
    }

    /* Preserve the composition while making narrow embeds easier to read. */
    @media (max-width: 520px) {
      .signature { font-size: 32px; }
      .headline { font-size: 56px; }
      .role { font-size: 36px; }
      .statement { font-size: 48px; }
      .node-title { font-size: 34px; }
      .node-sub { font-size: 30px; }
      .footer { font-size: 32px; }
    }
  </style>

  <rect width="1200" height="740" rx="24" class="bg"/>
  <rect x="22" y="22" width="1156" height="696" rx="18" class="frame"/>

  <text x="60" y="86" class="signature accent">georg rybski</text>
  <text x="60" y="147" class="headline primary">systems that let software act</text>
  <text x="60" y="207" class="role secondary">full-stack / agentic systems / security</text>
  <line x1="60" y1="247" x2="1140" y2="247" class="hairline"/>

  <text x="60" y="331" class="statement primary">build what builds.</text>
  <text x="60" y="384" class="statement primary">own what follows.</text>

  <!-- Equal cards, left-aligned labels, and two shared text baselines. -->
  <g transform="translate(60 470)">
    <rect width="222" height="118" rx="12" class="node"/>
    <text x="24" y="45" class="node-title primary">define</text>
    <text x="24" y="85" class="node-sub secondary">policy</text>
  </g>
  <line x1="294" y1="529" x2="334" y2="529" class="flow" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g transform="translate(346 470)">
    <rect width="222" height="118" rx="12" class="node"/>
    <text x="24" y="45" class="node-title primary">scope</text>
    <text x="24" y="85" class="node-sub secondary">authority</text>
  </g>
  <line x1="580" y1="529" x2="620" y2="529" class="flow" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Validation deliberately remains outside the execution boundary. -->
  <rect x="616" y="454" width="254" height="150" rx="18" class="boundary"/>
  <g transform="translate(632 470)">
    <rect width="222" height="118" rx="12" class="node"/>
    <text x="24" y="45" class="node-title primary">delegate</text>
    <text x="24" y="85" class="node-sub secondary">work</text>
  </g>
  <line x1="866" y1="529" x2="906" y2="529" class="flow" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g transform="translate(918 470)">
    <rect width="222" height="118" rx="12" class="node"/>
    <text x="24" y="45" class="node-title primary">validate</text>
    <text x="24" y="85" class="node-sub secondary">results</text>
  </g>

  <line x1="60" y1="637" x2="1140" y2="637" class="hairline"/>
  <text x="60" y="686" class="footer secondary">typescript / rust / nix / linux</text>
</svg>
