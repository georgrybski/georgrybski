<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc">
  <title id="title">Georg Rybski | Software engineer</title>
  <desc id="desc">
    Systems that let software act. Full-stack / agentic systems / security.
    Build what builds. Own what follows. Define policy, scope authority,
    delegate work, validate results. Delegated work has its own boundary;
    validation stays outside it. TypeScript / Rust / Nix / Linux.
  </desc>

  <defs>
    <linearGradient
      id="whole-card-gradient"
      gradientUnits="userSpaceOnUse"
      x1="22"
      y1="22"
      x2="1178"
      y2="718"
    >
      <stop offset="0%" class="grad-blue-edge"/>
      <stop offset="28%" class="grad-blue-edge"/>
      <stop offset="50%" class="grad-red-core"/>
      <stop offset="72%" class="grad-blue-edge"/>
      <stop offset="100%" class="grad-blue-edge"/>
    </linearGradient>

    <marker
      id="arrow"
      viewBox="0 0 10 10"
      refX="8"
      refY="5"
      markerWidth="6.5"
      markerHeight="6.5"
      orient="auto"
    >
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow"/>
    </marker>
  </defs>

  <style>
    .bg {
      fill: #ffffff;
    }

    .frame,
    .node {
      fill: #f6f8fa;
      stroke: #c8d1db;
      stroke-width: 1.5;
    }

    .hairline {
      stroke: #c8d1db;
      stroke-width: 1.5;
    }

    .flow {
      stroke: #b1bac4;
      stroke-width: 1.5;
    }

    .arrow {
      fill: #b1bac4;
    }

    .primary {
      fill: #1f2328;
    }

    .secondary {
      fill: #48515b;
    }

    .gradient-text {
      fill: url(#whole-card-gradient);
    }

    .selected-node {
      fill: #f6f8fa;
      stroke: url(#whole-card-gradient);
      stroke-width: 2.5;
    }

    .selected-sub {
      fill: url(#whole-card-gradient);
    }

    .grad-blue-edge {
      stop-color: #0969da;
    }

    .grad-red-core {
      stop-color: #cf222e;
    }

    text {
      font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Monaco,
        Consolas,
        "Liberation Mono",
        "Courier New",
        monospace;
    }

    .signature {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 1.2px;
    }

    .headline {
      font-size: 46px;
      font-weight: 700;
      letter-spacing: -1px;
    }

    .role {
      font-size: 24px;
    }

    .statement {
      font-size: 38px;
      font-weight: 600;
      letter-spacing: -0.45px;
    }

    .node-title {
      font-size: 30px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .node-sub {
      font-size: 23px;
    }

    .node-sub-strong {
      font-size: 23px;
      font-weight: 700;
    }

    .footer {
      font-size: 22px;
    }

    @media (prefers-color-scheme: dark) {
      .bg {
        fill: #0d1117;
      }

      .frame,
      .node {
        fill: #161b22;
        stroke: #3a424c;
      }

      .selected-node {
        fill: #161b22;
      }

      .hairline {
        stroke: #3a424c;
      }

      .flow {
        stroke: #5b6570;
      }

      .arrow {
        fill: #5b6570;
      }

      .primary {
        fill: #f0f6fc;
      }

      .secondary {
        fill: #a1abb5;
      }

      .grad-blue-edge {
        stop-color: #58a6ff;
      }

      .grad-red-core {
        stop-color: #ff7b72;
      }
    }

    @media (max-width: 520px) {
      .signature {
        font-size: 32px;
      }

      .headline {
        font-size: 56px;
      }

      .role {
        font-size: 36px;
      }

      .statement {
        font-size: 48px;
      }

      .node-title {
        font-size: 34px;
      }

      .node-sub,
      .node-sub-strong {
        font-size: 30px;
      }

      .footer {
        font-size: 32px;
      }
    }
  </style>

  <rect width="1200" height="740" rx="24" class="bg"/>
  <rect x="22" y="22" width="1156" height="696" rx="18" class="frame"/>

  <text x="60" y="86" class="signature gradient-text">georg rybski</text>

  <text x="60" y="147" class="headline primary">systems that let software act</text>
  <text x="60" y="207" class="role secondary">full-stack / agentic systems / security</text>

  <line x1="60" y1="247" x2="1140" y2="247" class="hairline"/>

  <text x="60" y="331" class="statement primary">build what builds.</text>
  <text x="60" y="384" class="statement primary">own what follows.</text>

  <rect x="60" y="470" width="222" height="118" rx="12" class="node"/>
  <text x="84" y="515" class="node-title primary">define</text>
  <text x="84" y="555" class="node-sub secondary">policy</text>

  <line
    x1="282"
    y1="529"
    x2="334"
    y2="529"
    class="flow"
    marker-end="url(#arrow)"
  />

  <rect x="346" y="470" width="222" height="118" rx="12" class="node"/>
  <text x="370" y="515" class="node-title primary">scope</text>
  <text x="370" y="555" class="node-sub secondary">authority</text>

  <line
    x1="568"
    y1="529"
    x2="620"
    y2="529"
    class="flow"
    marker-end="url(#arrow)"
  />

  <rect x="632" y="470" width="222" height="118" rx="12" class="node"/>
  <text x="656" y="515" class="node-title primary">delegate</text>
  <text x="656" y="555" class="node-sub secondary">work</text>

  <line
    x1="854"
    y1="529"
    x2="906"
    y2="529"
    class="flow"
    marker-end="url(#arrow)"
  />

  <rect
    x="918"
    y="470"
    width="222"
    height="118"
    rx="12"
    class="selected-node"
  />

  <text x="942" y="515" class="node-title primary">validate</text>
  <text x="942" y="555" class="node-sub-strong selected-sub">results</text>

  <line x1="60" y1="637" x2="1140" y2="637" class="hairline"/>

  <text x="60" y="686" class="footer secondary">
    typescript / rust / nix / linux
  </text>
</svg>
